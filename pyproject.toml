[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "api-smoke-tester"
version = "0.1.0"
description = "Declarative HTTP API smoke tests defined in JSON, with zero dependencies."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Yazan Aljabari" }]
keywords = ["testing", "api", "smoke-test", "http", "qa"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Software Development :: Testing",
]

[project.urls]
Homepage = "https://github.com/yazanus94-dot/api-smoke-tester"
Issues = "https://github.com/yazanus94-dot/api-smoke-tester/issues"

[project.scripts]
apismoke = "apismoke.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
